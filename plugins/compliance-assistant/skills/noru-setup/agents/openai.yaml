interface:
  display_name: "Noru Setup"
  short_description: "Connect Noru and check scopes and toolsets"
  icon_small: "./assets/composer-icon.svg"
  icon_large: "./assets/logo.png"
  brand_color: "#111B1C"
  default_prompt: "Use $noru-setup to check my Noru connection."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "noru"
      description: "Noru compliance workspace"
      transport: "streamable_http"
      url: "https://api.noru.tech/v1/mcp"
